function render(opened=new Set()){const m=$('month').value,g=$('group').value,w=$('workplace').value,r=$('manager').value,q=$('search').value.trim().toLocaleLowerCase();const rows=data.people.filter(p=>(!w||p.workplace===w)&&(!r||p.manager===r)&&(!g||p.group===g)&&(!q||p.name.toLocaleLowerCase().includes(q))&&Object.keys(p.days).some(d=>d.startsWith(m)));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);$('cards').replaceChildren();$('count').textContent='共 '+rows.length+' 人';for(const p of rows.slice((page-1)*size,page*size)){const card=el('details',undefined,'person'),summary=el('summary'),who=el('div');who.append(el('h2',p.name),el('div',p.workplace+' · '+p.group,'group'),el('div','负责人：'+p.manager,'group'));summary.append(who,el('div',m===today.slice(0,7)?'今日 '+(p.days[today]||'未排班'):'查看整月排班','today'));card.dataset.personKey=JSON.stringify([p.name,p.workplace,p.manager,p.group]);card.append(summary);let built=opened.has(card.dataset.personKey);if(built){card.open=true;card.append(calendar(p,m))}card.addEventListener('toggle',()=>{if(card.open&&!built){card.append(calendar(p,m));built=true}});$('cards').append(card)}if(!rows.length)$('cards').append(el('div',data.generatedAt?'没有符合条件的排班，请调整筛选；该月也可能尚未排班。':'排班尚未同步。','empty'));$('page').textContent=page+' / '+pages;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
['month','workplace','manager','group'].forEach(id=>$(id).addEventListener('change',()=>{page=1;updateFilters();render()}));$('search').addEventListener('input',()=>{page=1;render()});$('prev').addEventListener('click',()=>{page--;render()});$('next').addEventListener('click',()=>{page++;render()});render();

const live = $('live-status');
const canCheck = window.top === window && /^https?:$/.test(location.protocol);
let checking = false, lastAttempt = 0, etag = null;
const personKey = p => JSON.stringify([p.name,p.workplace,p.manager,p.group]);
function keepReading(action) {
  const oldCounts = new Map();
  for (const p of data.people) oldCounts.set(personKey(p),(oldCounts.get(personKey(p))||0)+1);
  const opened = new Set([...document.querySelectorAll('details[open]')].map(c=>c.dataset.personKey).filter(k=>oldCounts.get(k)===1));
  const scroll = window.scrollY;
  action();
  const counts = new Map();
  for (const p of data.people) counts.set(personKey(p),(counts.get(personKey(p))||0)+1);
  for (const k of opened) if (counts.get(k)!==1) opened.delete(k);
  render(opened);
  window.scrollTo(0,scroll);
}
function validSnapshot(value) {
  const object = v => v && typeof v==='object' && !Array.isArray(v);
  const text = v => typeof v==='string' && v.length<=1000;
  if (!object(value) || value.version!==1 || !Array.isArray(value.months) || value.months.length!==2
      || value.months.some(m=>typeof m!=='string'||!/^\d{4}-(0[1-9]|1[0-2])$/.test(m))
      || new Set(value.months).size!==2 || !Array.isArray(value.people) || value.people.length>50000
      || typeof value.generatedAt!=='string' || !Number.isFinite(Date.parse(value.generatedAt))) throw Error('snapshot');
  let cells=0;
  const people=value.people.map(p=>{
    if (!object(p)||!['name','group','workplace','manager'].every(k=>text(p[k]))||!object(p.days)) throw Error('person');
    const entries=Object.entries(p.days);cells+=entries.length;
    if(cells>50000||entries.some(([d,s])=>!/^\d{4}-\d{2}-\d{2}$/.test(d)||!value.months.includes(d.slice(0,7))
      || !Number.isFinite(Date.parse(d)) || new Date(d).toISOString().slice(0,10)!==d || !text(s))) throw Error('days');
    return {name:p.name,group:p.group,workplace:p.workplace,manager:p.manager,days:Object.fromEntries(entries)};
  });
  return {version:1,months:value.months,people,generatedAt:value.generatedAt};
}
async function readSnapshot(response) {
  if (!response.ok || !response.headers.get('content-type')?.includes('text/html') || Number(response.headers.get('content-length'))>8*1024*1024) throw Error('response');
  const reader=response.body.getReader(),decoder=new TextDecoder();let html='',bytes=0;
  try {
    while(true){const {done,value}=await reader.read();if(done)break;bytes+=value.byteLength;if(bytes>8*1024*1024)throw Error('size');html+=decoder.decode(value,{stream:true});}
    html+=decoder.decode();
  } finally {await reader.cancel();reader.releaseLock();}
  const marker=/<!-- public-schedule:v1 ([a-f0-9]{64}) -->/.exec(html);
  const payload=/<script id="schedule-data" type="application\/json">([\s\S]*?)<\/script>/.exec(html);
  if(!marker||!payload)throw Error('format');
  return {hash:marker[1],snapshot:validSnapshot(JSON.parse(payload[1]))};
}
async function checkLatest() {
  if(!canCheck||document.hidden||checking||Date.now()-lastAttempt<5000)return;
  updateTimestamp();
  if(!navigator.onLine){live.textContent='网络已断开，保留当前排班；联网后自动更新。';return;}
  checking=true;lastAttempt=Date.now();live.textContent='正在检查更新…';
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
  try {
    const url=new URL(location.pathname,location.origin);url.searchParams.set('schedule-check',String(Date.now()));
    const response=await fetch(url,{cache:'no-store',credentials:'omit',mode:'same-origin',redirect:'error',signal:controller.signal,headers:etag?{'If-None-Match':etag}:{}});
    if(response.status===304&&!etag)throw Error('unexpected-not-modified');
    const next=response.status===304?null:await readSnapshot(response);
    if(next&&data.generatedAt&&Date.parse(next.snapshot.generatedAt)<Date.parse(data.generatedAt))throw Error('older');
    const changed=next&&next.hash!==currentHash;
    const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    if(changed||today!==date)keepReading(()=>{
      today=date;
      if(changed){data=next.snapshot;currentHash=next.hash;$('schedule-data').textContent=JSON.stringify(data);updateMonths();updateFilters();}
      updateTimestamp();
    });
    if(response.status!==304)etag=response.headers.get('etag');
    live.textContent=changed?'排班已自动更新，无需刷新。':'自动更新已开启，每分钟检查；有变化时自动显示。';
  } catch {
    live.textContent='暂时无法检查更新，保留当前排班；稍后自动重试。';
  } finally {clearTimeout(timeout);checking=false;}
}
if(canCheck){
  live.textContent='自动更新已开启，每分钟检查；有变化时自动显示。';
  setInterval(checkLatest,60000);
  document.addEventListener('visibilitychange',checkLatest);
  window.addEventListener('pageshow',checkLatest);
  window.addEventListener('focus',checkLatest);
  window.addEventListener('online',()=>{lastAttempt=0;void checkLatest()});
  window.addEventListener('offline',()=>{live.textContent='网络已断开，保留当前排班；联网后自动更新。'});
  void checkLatest();
}else{live.textContent='当前为排班预览；外网页面支持自动更新。';}

})();</script></body></html>
