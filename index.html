<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>排班查询</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182439;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px 60px}.eyebrow{font-size:12px;letter-spacing:3px;color:#447266;font-weight:700}h1{font-size:32px;margin:6px 0}p{margin:6px 0;color:#607087}.head{display:flex;justify-content:space-between;align-items:center;gap:20px}.pill{background:#e6f3ed;color:#266c51;border-radius:24px;padding:6px 14px;font-size:13px;white-space:nowrap}.filters{display:grid;grid-template-columns:180px 1fr 1.5fr;gap:14px;padding:20px;background:white;border:1px solid #e1e7ef;border-radius:18px;margin:24px 0 12px}label{font-size:12px;color:#607087;display:block}input,select,button{font:inherit;border:1px solid #d4dce6;background:white;border-radius:9px;padding:10px;color:#182439;width:100%;margin-top:5px;min-height:44px}input:focus,select:focus,button:focus-visible{outline:2px solid #347d69;outline-offset:2px}button{cursor:pointer;width:auto;padding:8px 20px}.summary{margin:16px 0;display:flex;justify-content:space-between;gap:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.person{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:18px}.person summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}.person summary:after{content:'展开';font-size:12px;color:#447266}.person[open] summary:after{content:'收起'}.person h2{font-size:18px;margin:0}.group{font-size:12px;color:#607087}.today{font-size:13px;text-align:right;white-space:pre-line}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:18px}.weekday{text-align:center;font-size:11px;color:#8791a1}.day{border-radius:8px;background:#f3f6fa;min-height:80px;padding:5px 2px;text-align:center;overflow-wrap:anywhere}.day b{display:block;font-size:12px;color:#8791a1;font-weight:500}.day span{white-space:pre-line;font-size:10px;line-height:1.4;display:block}.day.rest{background:#eaf5ef;color:#2a7556}.day.current{outline:2px solid #33765f;outline-offset:-2px}.empty{padding:45px 16px;text-align:center;background:white;border-radius:16px;color:#607087}.paging{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px}button:disabled{opacity:.4;cursor:default}.note{font-size:12px;margin-top:24px}#stale{color:#9b611f;background:#fff1db;padding:12px;border-radius:10px;margin-top:12px}footer{border-top:1px solid #e1e7ef;margin-top:28px;padding-top:14px;font-size:12px;color:#8791a1}
@media(max-width:700px){main{padding:24px 14px 40px}h1{font-size:27px}.filters{grid-template-columns:1fr 1fr;padding:14px;gap:10px}.search{grid-column:1/-1}.cards{grid-template-columns:1fr}.head{align-items:flex-start}.pill{font-size:11px;padding:5px 9px}.person{padding:14px}.day{min-height:74px}.summary{font-size:13px}}
</style></head><body><main>
<header class="head"><div><div class="eyebrow">WORK SCHEDULE</div><h1>排班查询</h1><p>找到你的班组，提前安排每一天。</p></div><span class="pill">全员排班 · 只读</span></header>
<p id="updated"></p><p id="stale" hidden></p>
<section class="filters" aria-label="筛选排班"><label>月份<select id="month"></select></label><label>班组<select id="group"><option value="">全部班组</option></select></label><label class="search">姓名<input id="search" type="search" placeholder="输入姓名查找" autocomplete="off"></label></section>
<div class="summary"><span id="count" aria-live="polite"></span><span>绿色为休息日 · 时间为北京时间</span></div><section id="cards" class="cards" aria-label="员工排班"></section>
<div class="paging"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<p class="note">点击员工卡片展开整月排班。日期为班次开始日，结束时间早于开始时间表示次日下班。空白日期显示“未排班”，不代表休息。</p>
<footer>本页面为自动同步的排班快照，以最近同步结果为准；临时调整请联系班长。仅提供排班查询。</footer></main>
<script id="schedule-data" type="application/json">{"version":1,"months":["2026-10","2026-11"],"people":[],"generatedAt":null}</script><script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('schedule-data').textContent);const $=id=>document.getElementById(id);let page=1;const size=20;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
for(const m of data.months){const o=el('option',m.replace('-','年')+'月');o.value=m;$('month').append(o)}
for(const g of [...new Set(data.people.map(p=>p.group))].sort((a,b)=>a.localeCompare(b,'zh-CN'))){const o=el('option',g);o.value=g;$('group').append(o)}
$('updated').textContent=data.generatedAt?'数据更新时间：'+new Date(data.generatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'排班尚未同步，请稍后再来查看';
if(data.generatedAt&&Date.now()-Date.parse(data.generatedAt)>24*3600000){$('stale').hidden=false;$('stale').textContent='此排班快照已超过24小时，请留意临时改班通知。'}
function calendar(p,m){const wrap=el('div',undefined,'calendar');['一','二','三','四','五','六','日'].forEach(t=>wrap.append(el('div',t,'weekday')));const [y,mo]=m.split('-').map(Number);const offset=(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7;for(let i=0;i<offset;i++)wrap.append(el('div'));const days=new Date(Date.UTC(y,mo,0)).getUTCDate();for(let d=1;d<=days;d++){const key=m+'-'+String(d).padStart(2,'0'),text=p.days[key]||'未排班';const cell=el('div',undefined,'day'+(text==='休息'?' rest':'')+(key===today?' current':''));cell.append(el('b',String(d)),el('span',text));wrap.append(cell)}return wrap}
function render(){const m=$('month').value,g=$('group').value,q=$('search').value.trim().toLocaleLowerCase();const rows=data.people.filter(p=>(!g||p.group===g)&&(!q||p.name.toLocaleLowerCase().includes(q))&&Object.keys(p.days).some(d=>d.startsWith(m)));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);$('cards').replaceChildren();$('count').textContent='共 '+rows.length+' 人';for(const p of rows.slice((page-1)*size,page*size)){const card=el('details',undefined,'person'),summary=el('summary'),who=el('div');who.append(el('h2',p.name),el('div',p.group,'group'));summary.append(who,el('div',m===today.slice(0,7)?'今日 '+(p.days[today]||'未排班'):'查看整月排班','today'));card.append(summary);let built=false;card.addEventListener('toggle',()=>{if(card.open&&!built){card.append(calendar(p,m));built=true}});$('cards').append(card)}if(!rows.length)$('cards').append(el('div',data.generatedAt?'没有符合条件的排班，请调整筛选；该月也可能尚未排班。':'排班尚未同步。','empty'));$('page').textContent=page+' / '+pages;$('prev').disabled=page<=1;$('next').disabled=page>=pages}
['month','group'].forEach(id=>$(id).addEventListener('change',()=>{page=1;render()}));$('search').addEventListener('input',()=>{page=1;render()});$('prev').addEventListener('click',()=>{page--;render()});$('next').addEventListener('click',()=>{page++;render()});render();
})();</script></body></html>
