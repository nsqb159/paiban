  window.addEventListener('focus',()=>{startRealtime();requestLatest()});
  window.addEventListener('pagehide',()=>{closed=true;if(retry)clearTimeout(retry);void stopRealtime()});
  window.addEventListener('pageshow',()=>{closed=false;startRealtime();requestLatest()});
  // Local clock only; this timer never requests network data.
  setInterval(()=>{if(closed||document.hidden)return;const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    if(today!==date)keepReading(()=>{today=date;updateTimestamp()});else updateTimestamp();},60000);
  live.textContent='正在连接实时排班…';startRealtime();
}else if(isRealtime){live.textContent='当前为排班预览；外网页面支持实时更新。';}

})();</script></body></html>
